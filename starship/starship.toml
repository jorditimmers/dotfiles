"$schema" = 'https://starship.rs/config-schema.json'

# Catppuccin Mocha palette (https://github.com/catppuccin/starship)
palette = "catppuccin_mocha"

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$java\
$kotlin\
$aws\
$cmd_duration\
$jobs\
$character"""

right_format = "$time"

add_newline = false

[palettes.catppuccin_mocha]
text = "#cdd6f4"
overlay0 = "#6c7086"
mauve = "#cba6f7"
green = "#a6e3a1"
peach = "#fab387"
pink = "#f5c2e7"
sky = "#89dceb"
red = "#f38ba8"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
style = "bold mauve"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true

[git_branch]
style = "pink"
format = "[$branch]($style) "

[git_status]
style = "peach"
stashed = ""
format = '([\[$all_status$ahead_behind\]]($style) )'

[nodejs]
symbol = "󰎙"
style = "sky"
format = "[$symbol $version]($style) "

[java]
symbol = ""
style = "sky"
format = "[$symbol $version]($style) "

[kotlin]
symbol = "\U000f1219"
style = "sky"
format = "[$symbol $version]($style) "

[aws]
symbol = ""
style = "peach"
format = "[$symbol $profile]($style) "

[cmd_duration]
min_time = 3000
style = "overlay0"
format = "[took $duration]($style) "

[jobs]
symbol = "✦"
style = "pink"
format = "[$symbol$number]($style) "

[time]
disabled = false
time_format = "%R"
style = "overlay0"
format = "[$time]($style)"
