"$schema" = 'https://starship.rs/config-schema.json'

# Aura theme palette (https://github.com/daltonmenezes/aura-theme)
palette = "aura"

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$java\
$kotlin\
$aws\
$cmd_duration\
$jobs\
$character"""

right_format = "$time"

add_newline = false

[palettes.aura]
white = "#edecee"
gray = "#6d6d6d"
purple = "#a277ff"
green = "#61ffca"
orange = "#ffca85"
pink = "#f694ff"
blue = "#82e2ff"
red = "#ff6767"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
style = "bold purple"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true

[git_branch]
style = "pink"
format = "[$branch]($style) "

[git_status]
style = "orange"
stashed = ""
format = '([\[$all_status$ahead_behind\]]($style) )'

[nodejs]
symbol = "󰎙"
style = "blue"
format = "[$symbol $version]($style) "

[java]
symbol = ""
style = "blue"
format = "[$symbol $version]($style) "

[kotlin]
symbol = "\U000f1219"
style = "blue"
format = "[$symbol $version]($style) "

[aws]
symbol = ""
style = "orange"
format = "[$symbol $profile]($style) "

[cmd_duration]
min_time = 3000
style = "gray"
format = "[took $duration]($style) "

[jobs]
symbol = "✦"
style = "pink"
format = "[$symbol$number]($style) "

[time]
disabled = false
time_format = "%R"
style = "gray"
format = "[$time]($style)"
